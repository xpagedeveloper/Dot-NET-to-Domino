name: Cleanup merged branches

on:
  workflow_dispatch:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches already contained in main
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const protectedBranches = new Set(['main']);

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100
            });

            for (const branch of branches) {
              if (protectedBranches.has(branch.name) || branch.protected) {
                core.info(`Keeping ${branch.name}`);
                continue;
              }

              let comparison;
              try {
                comparison = await github.rest.repos.compareCommits({
                  owner,
                  repo,
                  base: branch.name,
                  head: 'main'
                });
              } catch (error) {
                core.warning(`Could not compare ${branch.name}: ${error.message}`);
                continue;
              }

              // Comparing branch -> main: identical or ahead means main contains
              // every commit reachable from the branch, so deletion is safe.
              if (comparison.data.status !== 'identical' && comparison.data.status !== 'ahead') {
                core.info(`Keeping unmerged branch ${branch.name} (${comparison.data.status})`);
                continue;
              }

              core.info(`Deleting merged branch ${branch.name}`);
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch.name}`
              });
            }
